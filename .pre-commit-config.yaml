repos:

  # ── Standard file hygiene ──────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml

  # ── YAML style ────────────────────────────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  # ── Markdown style ────────────────────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yaml, --fix]

  # ── K-type / README version sync ──────────────────────────────────────────
  # Ensures every README.md **Version:** line matches the version field in
  # the companion k-type.spec.yaml.  Update both together or the commit is blocked.
  - repo: local
    hooks:
      - id: check-readme-versions
        name: Check README version headers match k-type spec versions
        language: python
        entry: python scripts/check_readme_versions.py
        pass_filenames: false
        additional_dependencies: [pyyaml]
