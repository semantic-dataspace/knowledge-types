format_version: "0.1"
$id: "https://raw.githubusercontent.com/semantic-dataspace/knowledge-types/organization-v0.1.0/k-types/organization/specs/k-type.spec.yaml"

id: organization
version: "0.1.0"
maturity: "draft"

name: "Organization"
description: >
  An institution, company, department, or other formal group of people.
  Can be nested: a department is a sub-organisation of a university.

synonyms:
  - "organisation"
  - "institution"
  - "company"

ontology_classes:
  - iri: "http://www.w3.org/ns/org#Organization"
    label: "Organization"
    ontology: W3C-ORG
  - iri: "http://xmlns.com/foaf/0.1/Organization"
    label: "Organization"
    ontology: FOAF
  - iri: "https://schema.org/Organization"
    label: "Organization"
    ontology: schema.org

class_mapping:
  - "https://w3id.org/emmo#EMMO_c0f72631_d7c2_434c_9c26_5c44123df682"

custom_properties:
  semantics_enabled: true
  sections_enabled: false
  class_mapping:
    - "http://xmlns.com/foaf/0.1/Organization"
  sections:
    - id: id21866f42d5176
      name: "Untitled Section"
      inputs:
        - id: id4d61120f8538b
          label: "Name of the Organisation"
          widget: Text
          required: false
          relation_mapping:
            iri: "http://xmlns.com/foaf/0.1/name"
            type: data_property
        - id: id2af8ad6c4bb5a
          label: "Sub Organisation of"
          widget: Knowledge item
          required: false
          hint: "Please select the upper organisation"
          multiple_selection: false
          knowledge_type:
            - organization
          relation_mapping:
            iri: "http://www.w3.org/ns/org#subOrganizationOf"
            type: data_property
        - id: id5880a22a80ecf
          label: "URL of the webpage"
          widget: Text
          required: false
          relation_mapping:
            iri: "http://www.w3.org/ns/dcat#accessURL"
            type: data_property
        - id: id3e32c796f00c7
          label: "City"
          widget: Text
          required: false
          relation_mapping:
            iri: "http://www.w3.org/ns/org#location"
            type: data_property
        - id: id5597c3fd52603
          label: "Address"
          widget: Knowledge item
          required: false
          multiple_selection: false
          knowledge_type:
            - address
          relation_mapping:
            iri: "http://www.w3.org/ns/org#location"
            type: data_property
        - id: input-org-ror
          label: "ROR ID"
          widget: Text
          required: false
          hint: "Research Organisation Registry identifier, e.g. 04aj4c181"
          relation_mapping:
            iri: "https://schema.org/identifier"
            type: data_property

tags: [agent, organization]
