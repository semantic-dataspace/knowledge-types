format_version: "0.1"
$id: "https://raw.githubusercontent.com/semantic-dataspace/knowledge-types/nanoindentation-v0.1.0/k-types/nanoindentation/specs/k-type.spec.yaml"

id: nanoindentation
version: "0.1.0"
maturity: 'draft'

name: "Nanoindentation Experiment"
description: >
  An instrumented nanoindentation session following the Oliver-Pharr method (ISO 14577).
  Records the instrument configuration, test protocol, and session-level summary statistics
  (mean hardness, elastic modulus, depth) across all valid indents. Individual per-indent
  data files are represented as nanoindentation-dataset KItems linked via prov:generated.

synonyms:
  - "instrumented indentation test"
  - "depth-sensing indentation"
  - "nanoindentation test"
  - "Nanoindentation"

extends: ../characterization-process/specs/k-type.spec.yaml

ontology_classes:
  - iri: "https://w3id.org/emmo/domain/characterisation-methodology/chameo#Nanoindentation"
    label: "Nanoindentation"
    ontology: CHAMEO
  - iri: "http://purl.obolibrary.org/obo/OBI_0000070"
    label: "Assay"
    ontology: OBI

semantic_schemas:
  - id: "characterization/nanoindentation/PMDCo"
    version: "0.2.0"
    url: "https://github.com/semantic-dataspace/semantic-schemas/blob/kiran/schemas/characterization/nanoindentation/PMDCo/specs/schema.oold.yaml"
    role: measurement_results

tags: [process, characterization, mechanical-testing, nanoindentation, hardness, elastic-modulus]
