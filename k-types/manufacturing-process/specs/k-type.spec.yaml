format_version: "0.1"
$id: "https://raw.githubusercontent.com/semantic-dataspace/knowledge-types/manufacturing-process-v0.1.1/k-types/manufacturing-process/specs/k-type.spec.yaml"

id: manufacturing-process
version: "0.1.1"
maturity: 'draft'

name: "Manufacturing Process"
description: >
  A process that transforms, shapes, or produces a material or component.
  Examples: cold rolling, heat treatment, casting, additive manufacturing.
  Extend this k-type for specific manufacturing operations.

synonyms:
  - "production process"
  - "forming process"

extends: ../process/specs/k-type.spec.yaml

ontology_classes:
  - iri: "https://w3id.org/pmd/co/PMD_0000833"
    label: "Manufacturing Process"
    ontology: PMDCo

semantic_schemas:
  - id: "manufacturing/generic/PMDCo"
    version: "0.2.0"
    url: "https://github.com/semantic-dataspace/semantic-schemas/blob/manufacturing-generic-PMDCo-v0.2.0/schemas/manufacturing/generic/PMDCo/specs/schema.oold.yaml"
    role: process_step

custom_properties:
  semantics_enabled: true
  sections_enabled: true
  sections:
    - id: section-mfg-params
      name: "Process Parameters"
      inputs:
        - id: input-mfg-duration
          label: "Process duration"
          widget: Number
          required: false
          measurement_unit:
            iri: "http://qudt.org/vocab/unit/SEC"
            label: "Second"
            symbol: "s"
            namespace: qudt
          relation_mapping:
            iri: "https://w3id.org/steel/ProcessOntology/hasTime_Object"
            type: data_property
        - id: input-mfg-temperature
          label: "Temperature"
          widget: Number
          required: false
          measurement_unit:
            iri: "http://qudt.org/vocab/unit/DEG_C"
            label: "Degree Celsius"
            symbol: "°C"
            namespace: qudt

tags: [process, manufacturing]
