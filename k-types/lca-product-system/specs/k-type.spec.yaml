id: lca-product-system
version: "0.1.0"
maturity: 'draft'

context: true
context_member_types:
  - unit-process-inventory
  - manufacturing-process
  - material
  - lca-assessment

name: "LCA Product System"
description: >
  A process chain modelled for life cycle assessment: the linked unit process
  inventories that deliver a functional unit, with system boundary and
  background database. Acts as context for its inventories, processes and results.

synonyms:
  - "process chain (LCA)"
  - "LCA model"
  - "life cycle inventory chain"
  - "Produktsystem"

