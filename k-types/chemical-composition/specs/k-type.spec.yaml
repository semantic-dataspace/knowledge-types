format_version: "0.1"
$id: "https://raw.githubusercontent.com/semantic-dataspace/knowledge-types/chemical-composition-v0.1.1/k-types/chemical-composition/specs/k-type.spec.yaml"

id: chemical-composition
version: "0.1.1"
maturity: 'draft'

name: "Chemical Composition"
description: >
  The elemental or molecular composition of a material, expressed as mass
  fractions or atomic percentages per element. Backed by a semantic schema
  that produces RDF triples for each element fraction.

synonyms:
  - "elemental composition"
  - "alloy composition"

ontology_classes:
  - iri: "https://w3id.org/pmd/co/PMD_0000551"
    label: "Chemical Composition"
    ontology: PMDCo

semantic_schemas:
  - id: "chemical-composition/PMDCo"
    version: "0.2.0"
    url: "https://github.com/semantic-dataspace/semantic-schemas/blob/chemical-composition-PMDCo-v0.2.0/schemas/chemical-composition/PMDCo/specs/schema.oold.yaml"
    role: composition_record
  - id: "chemical-composition/BWMD"
    version: "0.2.0"
    url: "https://github.com/semantic-dataspace/semantic-schemas/blob/chemical-composition-BWMD-v0.2.0/schemas/chemical-composition/BWMD/specs/schema.oold.yaml"
    role: composition_record

tags: [material, composition]
