format_version: "0.1"
$id: "https://raw.githubusercontent.com/semantic-dataspace/knowledge-types/tensile-test-v0.1.1/k-types/tensile-test/specs/k-type.spec.yaml"

id: tensile-test
version: "0.1.1"
maturity: 'draft'

name: "Tensile Test"
description: >
  A uniaxial quasi-static tensile experiment that measures the mechanical
  properties of a material specimen: force, displacement, engineering stress,
  engineering strain, and derived quantities such as Young's modulus and
  tensile strength.

synonyms:
  - "uniaxial tensile test"
  - "tension test"
  - "Zugversuch"

extends: ../characterization-process/specs/k-type.spec.yaml

ontology_classes:
  - iri: "https://w3id.org/pmd/co/PMD_0000974"
    label: "Tensile Testing Process"
    ontology: PMDCo
  - iri: "https://w3id.org/steel/ProcessOntology/TensileTest"
    label: "Tensile Test"
    ontology: SteelProcessOntology

semantic_schemas:
  - id: "characterization/tensile-test/TTO"
    version: "0.2.0"
    url: "https://github.com/semantic-dataspace/semantic-schemas/blob/tensile-test-TTO-v0.2.0/schemas/characterization/tensile-test/TTO/specs/schema.oold.yaml"
    role: measurement_results
  - id: "characterization/tensile-test/PMDCo"
    version: "0.3.0"
    url: "https://github.com/semantic-dataspace/semantic-schemas/blob/tensile-test-PMDCo-v0.3.0/schemas/characterization/tensile-test/PMDCo/specs/schema.oold.yaml"
    role: measurement_results

# All relations are inherited from characterization-process:
#   has_operator    → expert          (required)
#   uses_instrument → measurement-device (required)
#   has_specimen    → specimen / material (required)
#   has_dataset     → dataset

tags: [process, characterization, mechanical-testing, tensile]
