format_version: "0.1"
$id: "https://raw.githubusercontent.com/semantic-dataspace/knowledge-types/specimen-v0.2.0/k-types/specimen/specs/k-type.spec.yaml"

id: specimen
version: "0.2.0"
maturity: 'draft'

name: "Specimen"
description: >
  A physical test piece prepared from a material for characterisation or
  mechanical testing. Inherits material identity fields and adds geometry
  and preparation metadata.

synonyms:
  - "test piece"
  - "sample"
  - "coupon"

ontology_classes:
  - iri: "https://w3id.org/pmd/co/Specimen"
    label: "Specimen"
    ontology: PMDCo
  - iri: "http://purl.obolibrary.org/obo/OBI_0100051"
    label: "Specimen"
    ontology: OBI

semantic_schemas:
  - id: "specimen/PMDCo"
    version: "0.3.0"
    url: "https://github.com/semantic-dataspace/semantic-schemas/blob/specimen-PMDCo-v0.3.0/schemas/specimen/PMDCo/specs/schema.oold.yaml"
    role: specimen_description

relations:
  - id: source
    label: "Source"
    description: "Semi-finished product (e.g. metal sheet) this specimen was cut or prepared from."
    iri: "http://www.w3.org/ns/prov#wasDerivedFrom"
    target_k_types: [semi-finished-product]
    cardinality: "0..1"
    required: false

custom_properties:
  semantics_enabled: true
  sections_enabled: false
  sections:
    - id: section-specimen-info
      name: "Specimen Information"
      inputs:
        - id: input-specimen-type
          label: "Specimen type"
          widget: Text
          required: false
          hint: "e.g. flat, round, notched"
          relation_mapping:
            iri: "https://w3id.org/steel/ProcessOntology/hasSampleType_Object"
            type: data_property
        - id: input-specimen-geometry
          label: "Specimen geometry"
          widget: Text
          required: false
          relation_mapping:
            iri: "https://w3id.org/steel/ProcessOntology/hasTestPieceGeometry_Object"
            type: data_property
        - id: input-specimen-width
          label: "Width"
          widget: Number
          required: false
          relation_mapping:
            iri: "https://w3id.org/steel/ProcessOntology/hasWidth_Object"
            type: data_property
        - id: input-specimen-length
          label: "Length"
          widget: Number
          required: false
          relation_mapping:
            iri: "https://w3id.org/steel/ProcessOntology/hasTestPieceLength_Object"
            type: data_property
        - id: input-specimen-thickness
          label: "Thickness"
          widget: Number
          required: false
          relation_mapping:
            iri: "https://w3id.org/steel/ProcessOntology/hasTestPieceThickness_Object"
            type: data_property
        - id: input-specimen-diameter
          label: "Diameter"
          widget: Number
          required: false
          relation_mapping:
            iri: "https://w3id.org/steel/ProcessOntology/hasDiameter_Object"
            type: data_property
        - id: input-specimen-description
          label: "Additional description"
          widget: Textarea
          required: false
          relation_mapping:
            iri: "https://w3id.org/steel/ProcessOntology/hasSampleInfos_Object"
            type: data_property

tags: [material, specimen]
