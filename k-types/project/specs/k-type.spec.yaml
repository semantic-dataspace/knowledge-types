format_version: "0.1"
$id: "https://raw.githubusercontent.com/semantic-dataspace/knowledge-types/project-v0.3.0/k-types/project/specs/k-type.spec.yaml"

id: project
version: "0.3.0"
maturity: 'draft'
context: true

name: "Project"
description: >
  A research or engineering project, such as a funded research initiative,
  collaborative programme, or industrial R&D project.
  Experts and organisations can be linked to projects they are or were involved in.

synonyms:
  - "research project"
  - "research programme"
  - "initiative"

class_mapping:
  - "https://w3id.org/pmd/co/Project"

ontology_classes:
  - iri: "http://vivoweb.org/ontology/core#Project"
    label: "Project"
    ontology: VIVO
  - iri: "https://schema.org/ResearchProject"
    label: "ResearchProject"
    ontology: schema.org

custom_properties:
  semantics_enabled: true
  sections_enabled: true
  sections:
    - id: id4cdf930805703
      name: "Fundamental information"
      inputs:
        - id: id1475863a6734b
          label: "Project short name"
          widget: Text
          required: false
          hint: "e.g. SPP-DaMic-P4"
          relation_mapping:
            iri: "https://w3id.org/steel/ProcessOntology/hasProjectName_Object"
            type: object_property
            class_iri: "https://www.materials.fraunhofer.de/ontologies/BWMD_ontology/domain#BWMD_00394"
        - id: id0e2567e83ee82
          label: "Project name"
          widget: Text
          required: false
          hint: "Full title of the project"
          relation_mapping:
            iri: "https://w3id.org/steel/ProcessOntology/hasProjectName"
            type: data_property
        - id: idb13d750ebf668
          label: "Organisation"
          widget: Knowledge item
          required: false
          multiple_selection: true
          knowledge_type:
            - organization
          relation_mapping:
            iri: "http://www.w3.org/ns/org#organization"
            type: property
        - id: idda331a2c485b6
          label: "Project number"
          widget: Text
          required: false
          hint: "e.g. 038282 (BMBF) or 101058682 (EC)"
          relation_mapping:
            iri: "https://w3id.org/steel/ProcessOntology/hasProjectNumber"
            type: data_property
        - id: idad6f75e0569f8
          label: "Project members"
          widget: Knowledge item
          required: false
          multiple_selection: true
          knowledge_type:
            - expert
          relation_mapping:
            iri: "https://d-nb.info/standards/elementset/agrelon#isMemberOf"
            type: property
        - id: idf533e1a7c76d8
          label: "Webpage of the project"
          widget: Text
          required: false
          hint: "e.g. https://my-project.eu"
          relation_mapping:
            iri: "https://w3id.org/emmo#EMMO_ac852bf0_3251_4d6b_9e57_acbfcb5e7e08"
            type: data_property
    - id: id1b9da0f945fda
      name: "Project related data"
      inputs:
        - id: ida9b609cef97dd
          label: "Dataset"
          widget: Knowledge item
          required: false
          multiple_selection: true
          knowledge_type:
            - dataset
          relation_mapping:
            iri: "https://w3id.org/steel/ProcessOntology/related"
            type: property
        - id: idf5a031991b475
          label: "Dataset catalog"
          widget: Knowledge item
          required: false
          multiple_selection: true
          relation_mapping:
            iri: "https://w3id.org/steel/ProcessOntology/related"
            type: property

tags: [project, research, programme]
