format_version: "0.1"
$id: "https://raw.githubusercontent.com/semantic-dataspace/knowledge-types/expert-v0.1.1/k-types/expert/specs/k-type.spec.yaml"

id: expert
version: "0.1.1"
maturity: 'draft'

name: "Expert"
description: >
  A person with domain expertise, such as a researcher, engineer, or technician.
  Experts can be linked to processes as operators and to materials and devices
  as subject-matter experts.

synonyms:
  - "researcher"
  - "engineer"
  - "technician"
  - "scientist"

extends: ../person/specs/k-type.spec.yaml

ontology_classes:
  - iri: "https://w3id.org/dsms/orchester/Expert"
    label: "Expert"
    ontology: ORCHESTER

semantic_schemas:
  - id: "expertise/VIVO"
    version: "0.3.0"
    url: "https://github.com/semantic-dataspace/semantic-schemas/blob/expertise-VIVO-v0.3.0/schemas/expertise/VIVO/specs/schema.oold.yaml"
    role: expertise_profile

custom_properties:
  semantics_enabled: true
  sections_enabled: true
  sections:
    - id: section-expert-expertise
      name: "Expertise"
      inputs:
        - id: input-field-of-study
          label: "Education or Field of Study"
          widget: Text
          required: false
          relation_mapping:
            iri: "https://d-nb.info/standards/elementset/gnd#fieldOfStudy"
            type: data_property

tags: [agent, person, expert]
