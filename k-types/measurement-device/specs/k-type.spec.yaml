format_version: "0.1"
$id: "https://raw.githubusercontent.com/semantic-dataspace/knowledge-types/measurement-device-v0.1.1/k-types/measurement-device/specs/k-type.spec.yaml"

id: measurement-device
version: "0.1.1"
maturity: 'draft'

name: "Measurement Device"
description: >
  A physical instrument or device used to perform measurements or characterisation
  experiments. Examples: tensile testing machine, SEM, XRD diffractometer, hardness tester.

synonyms:
  - "instrument"
  - "testing machine"
  - "measurement instrument"

ontology_classes:
  - iri: "http://purl.obolibrary.org/obo/OBI_0000968"
    label: "Device"
    ontology: OBI
  - iri: "https://w3id.org/pmd/co/PMD_0000602"
    label: "Device"
    ontology: PMDCo
  - iri: "https://w3id.org/emmo/domain/characterisation-methodology/chameo#CharacterisationMeasurementInstrument"
    label: "Characterisation Measurement Instrument"
    ontology: CHAMEO

semantic_schemas:
  - id: "measurement-device/PMDCo"
    version: "0.2.0"
    url: "https://github.com/semantic-dataspace/semantic-schemas/blob/measurement-device-PMDCo-v0.2.0/schemas/measurement-device/PMDCo/specs/schema.oold.yaml"
    role: device_description

custom_properties:
  semantics_enabled: true
  sections_enabled: false
  sections:
    - id: section-device-info
      name: "Device Information"
      inputs:
        - id: input-device-name
          label: "Name of measurement device"
          widget: Text
          required: true
          relation_mapping:
            iri: "https://w3id.org/ORCHESTER/measurement-device/HasMeasurementDeviceName"
            type: data_property
        - id: input-device-manufacturer
          label: "Manufacturer"
          widget: Text
          required: false
          relation_mapping:
            iri: "https://w3id.org/ORCHESTER/measurement-device/HasManufacturer"
            type: data_property
        - id: input-device-type
          label: "Device type"
          widget: Text
          required: false
          hint: "e.g. Universal testing machine, SEM, XRD"
          relation_mapping:
            iri: "https://w3id.org/ORCHESTER/measurement-device/MeasurementDeviceType"
            type: data_property
        - id: input-device-serial
          label: "Serial number"
          widget: Text
          required: false
          relation_mapping:
            iri: "https://w3id.org/ORCHESTER/measurement-device/HasSerialNumber"
            type: data_property
        - id: input-device-inventory
          label: "Inventory number"
          widget: Text
          required: false
          relation_mapping:
            iri: "https://w3id.org/ORCHESTER/measurement-device/HasInventoryNumber"
            type: data_property
        - id: input-device-room
          label: "Room number"
          widget: Text
          required: false
          relation_mapping:
            iri: "https://w3id.org/ORCHESTER/measurement-device/HasRoomNumber"
            type: data_property
        - id: input-device-range
          label: "Measurement range"
          widget: Textarea
          required: false
          relation_mapping:
            iri: "https://w3id.org/ORCHESTER/measurement-device/HasMeasurementRange"
            type: data_property

tags: [equipment, measurement-device]
