format_version: "0.1"

id: heat-treatment
version: "0.1.1"
maturity: draft

name: "Heat Treatment"
description: >
  A heat treatment process step applied to a material or specimen.
  Covers solution treatment, aging, annealing, normalizing, tempering,
  homogenization, and quenching operations.
  Each step links to its input specimen/billet and optional output specimen,
  and carries typed process parameters (temperature, time, rate, cooling medium)
  as PMDCo ParameterSpecification nodes with dsmsht: semantic IRIs.

synonyms:
  - "heat treatment step"
  - "thermal process"
  - "annealing"
  - "aging treatment"
  - "solution treatment"
  - "tempering"
  - "normalizing"
  - "homogenization"

extends: ../manufacturing-process/specs/k-type.spec.yaml

ontology_classes:
  - iri: "https://w3id.org/pmd/co/PMD_0000833"
    label: "Manufacturing Process"
    ontology: PMDCo

semantic_schemas:
  - id: "manufacturing/heat-treatment/PMDCo"
    version: "0.2.0"
    url: "https://github.com/semantic-dataspace/semantic-schemas/blob/kiran/schemas/manufacturing/heat-treatment/PMDCo/specs/schema.oold.yaml"
    role: process_step

tags: [process, manufacturing, heat-treatment, thermal, annealing, aging, solution-treatment, normalizing, tempering, homogenization, materials-science]
