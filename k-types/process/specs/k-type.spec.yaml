format_version: "0.1"
$id: "https://github.com/semantic-dataspace/knowledge-types/blob/main/k-types/process/specs/k-type.spec.yaml"

id: process
version: "0.1.0"
maturity: 'draft'

name: "Process"
description: >
  Abstract base k-type for all process-like concepts. A process transforms or
  characterises materials over time. Do not use this k-type directly: extend it
  with a more specific type such as manufacturing-process or characterization-process.

ontology_classes:
  - iri: "https://w3id.org/pmd/co/Process"
    label: "Process"
    ontology: PMDCo

kv_properties:
  enabled: true
  semantic_mapping: true

custom_properties:
  semantics_enabled: true
  sections_enabled: false
  sections:
    - id: section-process-base
      name: "Basic Information"
      inputs:
        - id: input-process-identifier
          label: "Identifier"
          widget: Text
          required: false
          relation_mapping:
            iri: "https://w3id.org/steel/ProcessOntology/hasIdentifier_Object"
            type: data_property
        - id: input-process-description
          label: "Description"
          widget: Textarea
          required: false
          relation_mapping:
            iri: "https://w3id.org/steel/ProcessOntology/hasRemark_Object"
            type: data_property
        - id: input-process-start
          label: "Start time"
          widget: Datetime
          required: false
          relation_mapping:
            iri: "http://www.w3.org/ns/prov#startedAtTime"
            type: data_property
        - id: input-process-end
          label: "End time"
          widget: Datetime
          required: false
          relation_mapping:
            iri: "http://www.w3.org/ns/prov#endedAtTime"
            type: data_property

tags: [process]
