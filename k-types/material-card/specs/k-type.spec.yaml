format_version: "0.1"
$id: "https://raw.githubusercontent.com/semantic-dataspace/knowledge-types/material-card-v0.1.3/k-types/material-card/specs/k-type.spec.yaml"

id: material-card
version: "0.1.3"
maturity: 'draft'

name: "Material Card"
description: >
  A structured summary of a material's properties, combining identity,
  chemical composition, mechanical characterisation results, and provenance
  in a single record. Acts as a cross-schema template: it orchestrates
  multiple semantic schemas and links to the material and characterisation
  k-items that contributed data.

synonyms:
  - "material data sheet"
  - "material passport"

ontology_classes:
  - iri: "https://w3id.org/dsms/orchester/MaterialCard"
    label: "Material Card"
    ontology: ORCHESTER

semantic_schemas:
  - id: "material-card/mechanical/PMDCo"
    version: "0.3.0"
    url: "https://github.com/semantic-dataspace/semantic-schemas/blob/material-card-mechanical-PMDCo-v0.3.0/schemas/material-card/mechanical/PMDCo/specs/schema.oold.yaml"
    role: material_card_template
  - id: "workflow/OBI"
    version: "0.2.0"
    url: "https://github.com/semantic-dataspace/semantic-schemas/blob/workflow-OBI-v0.2.0/schemas/workflow/OBI/specs/schema.oold.yaml"
    role: workflow_record
  - id: "specimen/PMDCo"
    version: "0.4.0"
    url: "https://github.com/semantic-dataspace/semantic-schemas/blob/specimen-PMDCo-v0.4.0/schemas/specimen/PMDCo/specs/schema.oold.yaml"
    role: specimen_description
  - id: "chemical-composition/PMDCo"
    version: "0.2.0"
    url: "https://github.com/semantic-dataspace/semantic-schemas/blob/chemical-composition-PMDCo-v0.2.0/schemas/chemical-composition/PMDCo/specs/schema.oold.yaml"
    role: composition_record

kv_properties:
  enabled: true
  semantic_mapping: true

tags: [material, data, material-card]
