format_version: "0.1"
$id: "https://raw.githubusercontent.com/semantic-dataspace/knowledge-types/nanoindentation-dataset-v0.1.1/k-types/nanoindentation-dataset/specs/k-type.spec.yaml"

id: nanoindentation-dataset
version: "0.1.1"
maturity: 'draft'

name: "Nanoindentation Dataset"
description: >
  The digital twin of a single nanoindentation indent file (one load-displacement curve).
  Stores per-indent metadata (index, stage position, timestamp, analysis warnings) and all
  scalar results from the Oliver-Pharr analysis (HIT, EIT, E*, Er, HVIT, hmax, hc, hr, hp,
  S, Ap, Welast, Wplast, Wtotal, nIT, RIT, m, Epsilon, R², F/S²). The raw time-series
  (load-displacement CSV) is attached as a file and annotated via data2rdf.

synonyms:
  - "indent dataset"
  - "nanoindentation measurement file"
  - "instrumented indentation result"

extends: ../dataset/specs/k-type.spec.yaml

ontology_classes:
  - iri: "http://www.w3.org/ns/dcat#Dataset"
    label: "Dataset"
    ontology: DCAT

semantic_schemas:
  - id: "dataset/nanoindentation/PMDCo"
    version: "0.1.0"
    url: "https://github.com/semantic-dataspace/semantic-schemas/blob/kiran/schemas/dataset/nanoindentation/PMDCo/specs/schema.oold.yaml"
    role: dataset_description

tags: [data, dataset, nanoindentation, hardness, elastic-modulus, load-displacement]
