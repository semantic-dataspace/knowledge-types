id: nakajima-test
version: "0.1.1"
maturity: 'draft'

name: "Nakajima Test"
description: >
  A Nakajima forming-limit test that determines the forming limit curve (FLC)
  of sheet metal by deforming specimens of varying widths over a hemispherical
  punch until localised necking occurs. The FLC defines the boundary between
  safe and failed strain states for sheet forming processes.

synonyms:
  - "forming limit test"
  - "FLC test"
  - "Nakajimaversuch"

extends: ../characterization-process/specs/k-type.spec.yaml

ontology_classes:
  - iri: "http://purl.obolibrary.org/obo/OBI_0000070"
    label: "assay"
    ontology: OBI

semantic_schemas:
