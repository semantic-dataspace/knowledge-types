default: true

# MD013: Line length
# Tables are exempt; prose and code blocks allow up to 160 chars.
MD013:
  line_length: 160
  heading_line_length: 80
  code_block_line_length: 120
  code_blocks: true
  tables: false

# MD033: Inline HTML — allowed for special formatting in docs.
MD033: false

# MD041: First line must be a top-level heading.
# Disabled because some files start with a comment block.
MD041: false

# MD024: No duplicate headings — allow same text in different sections.
MD024:
  siblings_only: true

# MD007: Unordered list indentation — 2 spaces.
MD007:
  indent: 2
